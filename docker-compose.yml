services:
  # Spring Boot 애플리케이션
  egobook-api:
    build: .
    container_name: egobook-server
    restart: always
    depends_on:
      - redis-db
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/resources/firebase-service-account.json
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./src/main/resources/firebase-service-account.json:/app/resources/firebase-service-account.json
    networks:
      - egobook-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # 로그 파일 하나당 최대 10MB
        max-file: "3"     # 최대 파일 개수 3개 (오래된 건 삭제)

  # Redis
  redis-db:
    image: redis:latest
    container_name: redis-cache
    restart: always  # <--- 이 설정이 있으면 EC2가 꺼졌다 켜져도 도커가 알아서 실행해줍니다.
    volumes:
      - ./redis/data:/data  # <--- Redis 데이터가 서버 재시작 후에도 유지되도록 저장소 연결
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    networks:
      - egobook-network

  # Nginx (리버스 프록시 / TLS 종단)
  nginx:
    image: nginx:alpine
    container_name: egobook-nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - egobook-api
    networks:
      - egobook-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  egobook-network:
    driver: bridge